<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wander Boys Trip Countdown</title>
  <style>
    :root {
      --bg-light: #f9f9f9;
      --text-light: #111;
      --bg-dark: #111;
      --text-dark: #f9f9f9;
    }

    body {
      position: relative;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-light);
      color: var(--text-light);
      font-family: "Arial", sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("wander-boys.JPEG") center/cover no-repeat;
      opacity: 0.28;
      z-index: 0;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.18);
      z-index: 0;
      pointer-events: none;
    }

    body.dark {
      background-color: var(--bg-dark);
      color: var(--text-dark);
    }

    body.dark::after {
      background: rgba(0, 0, 0, 0.22);
    }

    .top-message {
      position: absolute;
      top: 1.1rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      background: linear-gradient(135deg, #ffef9f, #ffb703, #ff7b00);
      color: #2b1400;
      border: 3px solid rgba(255, 255, 255, 0.65);
      border-radius: 999px;
      padding: 0.8rem 1.5rem;
      font-weight: 900;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      text-align: center;
      box-shadow: 0 8px 20px rgba(255, 122, 0, 0.35);
      display: none;
      text-transform: uppercase;
      animation: bannerPulse 1.4s ease-in-out infinite alternate;
    }

    .top-message::before,
    .top-message::after {
      content: "🎉";
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.3rem;
    }

    .top-message::before {
      left: 0.8rem;
    }

    .top-message::after {
      right: 0.8rem;
    }

    body.dark .top-message {
      background: linear-gradient(135deg, #ffd166, #ff9f1c, #ff6b35);
      color: #1a0d00;
    }

    .sparkle {
      position: absolute;
      z-index: 1;
      font-size: 1.5rem;
      opacity: 0.8;
      animation: floatUp 5s ease-in-out infinite;
    }

    .sparkle:nth-child(1) { top: 10%; left: 12%; }
    .sparkle:nth-child(2) { top: 15%; right: 18%; animation-delay: 0.8s; }
    .sparkle:nth-child(3) { bottom: 22%; left: 18%; animation-delay: 1.4s; }
    .sparkle:nth-child(4) { bottom: 18%; right: 12%; animation-delay: 2s; }

    @keyframes bannerPulse {
      from { transform: translateX(-50%) scale(1); }
      to { transform: translateX(-50%) scale(1.03); }
    }

    @keyframes floatUp {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.4; }
      50% { transform: translateY(-12px) rotate(12deg); opacity: 1; }
    }

    h1, #countdown, button {
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
      text-align: center;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
    }

    #countdown {
      font-size: 4rem;
      font-weight: bold;
      text-align: center;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.55);
      letter-spacing: 0.04em;
    }

    button {
      position: absolute;
      top: 1rem;
      right: 1rem;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #0078ff;
      color: white;
      font-size: 1rem;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #005ed6;
    }
  </style>
</head>
<body>
  <div class="sparkle">✨</div>
  <div class="sparkle">🎉</div>
  <div class="sparkle">✨</div>
  <div class="sparkle">🎊</div>

  <div id="topMessage" class="top-message">It's almost time to go, have you packed your bags?</div>
  <button id="themeToggle">🌙 Dark Mode</button>
  <h1>Countdown until WANDER BOYS TRIP</h1>
  <div id="countdown">Loading...</div>

  <script>
    const countdown = document.getElementById("countdown");
    const topMessage = document.getElementById("topMessage");
    const targetDate = new Date(2026, 9, 12, 11, 0, 0).getTime();
    const packingStartDate = new Date(2026, 9, 8, 0, 0, 0).getTime();
    const packingEndDate = new Date(2026, 9, 10, 23, 59, 59).getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance <= 0) {
        countdown.innerHTML = "🎉ITS TIME FOR THE TRIP!!🎉";
        topMessage.style.display = "none";
        clearInterval(timer);
        return;
      }

      if (now >= packingStartDate && now <= packingEndDate) {
        topMessage.style.display = "block";
      } else {
        topMessage.style.display = "none";
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)
      );
      const minutes = Math.floor(
        (distance % (1000 * 60 * 60)) / (1000 * 60)
      );
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      countdown.innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    const timer = setInterval(updateCountdown, 1000);
    updateCountdown();

    // Theme toggle
    const btn = document.getElementById("themeToggle");
    btn.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      if (document.body.classList.contains("dark")) {
        btn.textContent = "☀️ Light Mode";
      } else {
        btn.textContent = "🌙 Dark Mode";
      }
    });
  </script>
</body>
</html>
